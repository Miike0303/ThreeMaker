# Release builds for desktop installers (Windows / macOS / Linux) and a
# static web frontend artifact. Unsigned until secrets below are provisioned.
#
# Signing: COMMENTED hooks only. Provision the named repository secrets, then
# uncomment the matching blocks. Builds remain unsigned without them.
#
# Workflow validation: inspected by hand (no YAML parser dependency in-repo).

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  desktop:
    name: desktop-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2 / ubuntu-22.04)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version: reads packageManager from package.json when present
        # (repo pins pnpm@10.x). If that field is ever removed, set:
        # with:
        #   version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # -------------------------------------------------------------------------
      # CODE SIGNING (unsigned until the user provisions these secrets)
      #
      # Windows — import PFX then configure tauri thumbprint / signCommand:
      #   Secrets: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
      #   Docs: https://v2.tauri.app/distribute/sign/windows/
      #
      # - name: Import Windows certificate
      #   if: matrix.os == 'windows-latest'
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   shell: pwsh
      #   run: |
      #     New-Item -ItemType Directory -Force -Path certificate | Out-Null
      #     Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
      #     certutil -decode certificate/tempCert.txt certificate/certificate.pfx
      #     Remove-Item certificate/tempCert.txt
      #     Import-PfxCertificate `
      #       -FilePath certificate/certificate.pfx `
      #       -CertStoreLocation Cert:\CurrentUser\My `
      #       -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
      #     # Then set tauri.conf.json bundle.windows.certificateThumbprint
      #     # (or bundle.windows.signCommand) to the imported cert's thumbprint.
      #
      # macOS — signing + notarization env vars (Tauri v2):
      #   Secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      #            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #   Docs: https://v2.tauri.app/distribute/sign/macos/
      #
      # - name: macOS signing env
      #   if: matrix.os == 'macos-latest'
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     echo "APPLE_* secrets present; Tauri CLI picks them up during build."
      #     # Optional: import .p12 into a temporary keychain before tauri build
      #     # (see Tauri macOS CI example). Notarization uses APPLE_ID +
      #     # APPLE_PASSWORD (app-specific) + APPLE_TEAM_ID.
      # -------------------------------------------------------------------------

      - name: Tauri build (unsigned)
        run: pnpm --filter desktop tauri build

      - name: Upload desktop bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  # Static web: CI only produces the Vite frontend under dist/.
  # A playable game payload requires scripts/export-web-game.mjs against a
  # local ~/.threemaker (maps + asset-store). CI has none of that data and
  # the repo ships no sample game — do not invent a fake payload here.
  # Operators: pnpm --filter desktop export:web  (writes apps/desktop/dist-web/).
  web-export:
    name: web-export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend (dist/ only — no game payload in CI)
        run: pnpm --filter desktop build

      - name: Upload web-build artifact (Vite dist; no ~/.threemaker payload)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/desktop/dist/**
          if-no-files-found: error
